<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12233f">
  <meta name="description" content="20个人物形容词图文闪卡与双人同步贪吃蛇评估">
  <title>人物形容词 · 双蛇竞赛</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2312233f'/%3E%3Cpath d='M14 38c0-13 9-23 22-23 9 0 15 5 15 12 0 7-5 12-12 12h-8c-4 0-6 2-6 5s3 5 7 5h13' fill='none' stroke='%235ce1a7' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='39' cy='25' r='2.8' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root{
      --ink:#12233f;--muted:#60708a;--paper:#f7fbff;--card:#fff;--line:#dce8f4;
      --green:#17b978;--green2:#5ce1a7;--blue:#2e6cf6;--blue2:#82b1ff;
      --red:#ed4f62;--gold:#ffc857;--shadow:0 18px 45px rgba(18,35,63,.12);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--ink);background:
      radial-gradient(circle at 10% 0,#dff9ee 0,transparent 28rem),
      radial-gradient(circle at 90% 8%,#dfeaff 0,transparent 28rem),var(--paper);
      font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px;line-height:1.5}
    button,select,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,[tabindex]:focus-visible{outline:4px solid #ffc857;outline-offset:3px}
    .shell{width:min(1480px,100%);margin:auto;padding:18px clamp(14px,3vw,36px) 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:46px;height:46px;border-radius:14px;background:var(--ink);display:grid;place-items:center;color:#fff;font-size:25px;box-shadow:0 9px 22px #12233f33}
    h1{font-size:clamp(1.25rem,3vw,2rem);line-height:1.15;margin:0}.sub{color:var(--muted);font-size:.9rem}
    .top-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:12px;color:var(--ink);font-weight:800}
    .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#e8f0f8;padding:6px;border-radius:16px;margin-bottom:18px}
    .tab{border:0;background:transparent;padding:12px;border-radius:11px;font-weight:900;color:#5b6b84}
    .tab.active{background:#fff;color:var(--ink);box-shadow:0 5px 15px #12233f1a}
    .panel{display:none}.panel.active{display:block}
    .learn-layout{display:grid;grid-template-columns:minmax(290px,490px) 1fr;gap:22px;align-items:start}
    .study-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:14px;box-shadow:var(--shadow);position:sticky;top:14px}
    .art{aspect-ratio:1.25/1;border-radius:19px;background-image:url("adjectives-sprite.webp");background-repeat:no-repeat;background-color:#e9f3fb;background-size:500% 400%;box-shadow:inset 0 0 0 1px #d9e5f1}
    .card-copy{padding:17px 10px 7px;text-align:center}
    .word-line{display:flex;justify-content:center;align-items:center;gap:10px}
    .word{font-size:clamp(2rem,6vw,3.5rem);font-weight:950;letter-spacing:.06em}
    .speak{border:0;background:#e8fff5;color:#087a4b;border-radius:50%;width:42px;height:42px;font-size:20px}
    .pinyin{font-weight:800;color:var(--blue);letter-spacing:.08em}
    .meaning{margin:12px auto 3px;max-width:36ch;font-size:1.05rem}
    .bm{color:var(--muted);font-weight:700}
    .example{background:#f2f7ff;border-radius:13px;margin:13px 0 0;padding:10px 12px}
    .card-nav{display:grid;grid-template-columns:auto 1fr auto;gap:9px;margin-top:12px}
    .card-nav button,.primary,.secondary{border:0;border-radius:13px;padding:11px 16px;font-weight:900}
    .card-nav button{background:#edf3f8}.counter{display:grid;place-items:center;font-weight:900;color:var(--muted)}
    .bank-wrap{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 12px 34px #12233f0d}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    h2{margin:0;font-size:clamp(1.25rem,2.6vw,1.8rem)}.hint{font-size:.9rem;color:var(--muted)}
    .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;color:#52627b}
    .chip.active{color:#fff;background:var(--ink);border-color:var(--ink)}
    .word-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .mini-card{border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden;text-align:left;padding:0;transition:.18s transform,.18s box-shadow}
    .mini-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #12233f1a}
    .mini-art{aspect-ratio:1.2/1;background-image:url("adjectives-sprite.webp");background-size:500% 400%;background-repeat:no-repeat}
    .mini-copy{padding:9px 10px}.mini-word{font-size:1.07rem;font-weight:950}.mini-pinyin{font-size:.75rem;color:var(--muted)}
    .tag{display:inline-flex;border-radius:999px;padding:2px 7px;font-size:.72rem;font-weight:900;margin-top:5px}
    .tag.good{background:#dcf8eb;color:#087a4b}.tag.neutral{background:#e5efff;color:#2459c3}.tag.improve{background:#ffe7ea;color:#a92e3e}

    .game-start{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(18px,3vw,28px)}
    .game-start-inner{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
    .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
    .rule{background:#f2f7fb;border-radius:16px;padding:13px}.rule b{display:block;font-size:1.05rem}.rule span{font-size:.85rem;color:var(--muted)}
    .settings{background:#eff6ff;border-radius:19px;padding:18px}
    .setting{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin:10px 0;font-weight:800}
    select{border:1px solid #cbdbea;background:#fff;border-radius:11px;padding:8px 10px;color:var(--ink);font-weight:800}
    .primary{background:var(--ink);color:#fff;width:100%;font-size:1.08rem;padding:14px;box-shadow:0 9px 18px #12233f33}
    .game-wrap{display:none}.game-wrap.show{display:block}
    .scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:12px}
    .team-score{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;font-weight:900}
    .team-score.a{border-left:8px solid var(--green)}.team-score.b{border-right:8px solid var(--blue)}
    .score-num{font-size:1.55rem}.timer{background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px;text-align:center;font-size:1.35rem;font-weight:950;min-width:110px}
    .boards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .board-card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:12px;box-shadow:0 11px 28px #12233f12;min-width:0}
    .prompt{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin-bottom:9px;min-height:72px}
    .prompt-art{width:70px;height:70px;border-radius:13px;background-image:url("adjectives-sprite.webp");background-size:500% 400%;background-repeat:no-repeat;background-color:#edf5fb}
    .qnum{font-size:.76rem;color:var(--muted);font-weight:900}.clue{font-size:clamp(.9rem,1.5vw,1.08rem);font-weight:900;line-height:1.35}
    canvas{width:100%;aspect-ratio:4/3;background:#102039;border-radius:15px;display:block;touch-action:none}
    .control-label{text-align:center;color:var(--muted);font-size:.9rem;font-weight:900;margin:8px 0 5px}
    .game-actions{display:flex;justify-content:center;gap:8px;margin-top:12px}.secondary{background:#e6edf5;color:var(--ink)}
    #endBtn.armed{background:#ed4f62;color:#fff;box-shadow:0 0 0 4px #ffd6dc}
    .touch-zone{margin-top:9px;padding:8px 10px 10px;border-radius:16px;background:#f2f7fb;border:2px solid #d7e5f1}
    .board-card:first-child .touch-zone{border-color:#aee8cf;background:#effcf6}.board-card:last-child .touch-zone{border-color:#bad1ff;background:#f1f6ff}
    .dpad{display:grid;grid-template-columns:repeat(3,minmax(64px,86px));grid-template-rows:repeat(2,58px);justify-content:center;gap:7px;touch-action:none;user-select:none;-webkit-user-select:none}
    .dpad button{border:0;background:#fff;border-radius:15px;font-size:25px;font-weight:950;touch-action:none;user-select:none;box-shadow:0 5px 0 #c7d5e3,0 7px 14px #12233f18;transition:transform .06s,box-shadow .06s}
    .board-card:first-child .dpad button{color:#087a4b}.board-card:last-child .dpad button{color:#2459c3}
    .dpad button:active,.dpad button.pressed{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #aebfce}
    .dpad .up{grid-column:2}.dpad .left{grid-column:1}.dpad .down{grid-column:2}.dpad .right{grid-column:3}
    .countdown{position:fixed;inset:0;display:none;place-items:center;background:#07122599;color:#fff;font-size:clamp(6rem,18vw,13rem);font-weight:950;text-shadow:0 9px 0 #12233f;z-index:25;pointer-events:none}.countdown.show{display:grid}
    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:#12233f;color:#fff;padding:10px 18px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:20}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .modal{position:fixed;inset:0;background:#071225cc;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
    .modal.show{display:flex}.result{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:26px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}
    .winner{text-align:center;font-size:clamp(1.55rem,4vw,2.4rem);font-weight:950;margin-bottom:18px}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result-team{border:1px solid var(--line);border-radius:18px;padding:16px}
    .result-team h3{margin:0 0 10px}.stat{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding:7px 0}
    .modal-actions{display:flex;gap:9px;margin-top:16px}.modal-actions button{flex:1}
    .print-title{display:none}
    @media (max-width:950px){.learn-layout{grid-template-columns:1fr}.study-card{position:static}.word-grid{grid-template-columns:repeat(3,1fr)}.game-start-inner{grid-template-columns:1fr}}
    @media (max-width:720px){.boards{grid-template-columns:1fr}.scorebar{grid-template-columns:1fr 1fr}.timer{grid-column:1/-1;grid-row:1}.word-grid{grid-template-columns:repeat(2,1fr)}.rules{grid-template-columns:1fr}.shell{padding-inline:10px}header{align-items:flex-start}.sub{display:none}.icon-btn{padding:9px}}
    @media print{body{background:#fff}.modal{position:static;background:#fff;padding:0}.result{box-shadow:none;max-height:none;width:100%}.modal-actions{display:none}.print-title{display:block}header,.tabs,.panel{display:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">🐍</div>
        <div><h1>人物形容词 · 双蛇竞赛</h1><div class="sub">看图学词 · 同屏竞赛 · 即时评估</div></div>
      </div>
      <div class="top-actions"><button class="icon-btn" id="fullscreenBtn">⛶ 全屏</button></div>
    </header>

    <nav class="tabs" aria-label="学习模式">
      <button class="tab active" data-panel="learn">① 图文闪卡</button>
      <button class="tab" data-panel="game">② 双蛇竞赛</button>
    </nav>

    <main>
      <section class="panel active" id="learn">
        <div class="learn-layout">
          <article class="study-card" aria-live="polite">
            <div class="art" id="mainArt" role="img"></div>
            <div class="card-copy">
              <div class="word-line"><div class="word" id="mainWord"></div><button class="speak" id="speakBtn" aria-label="朗读词语">🔊</button></div>
              <div class="pinyin" id="mainPinyin"></div>
              <div class="meaning" id="mainMeaning"></div>
              <div class="bm" id="mainBm"></div>
              <div class="example" id="mainExample"></div>
            </div>
            <div class="card-nav">
              <button id="prevCard">← 上一张</button><div class="counter" id="counter"></div><button id="nextCard">下一张 →</button>
            </div>
          </article>
          <section class="bank-wrap">
            <div class="section-title"><div><h2>20个形容人的形容词</h2><div class="hint">点击小卡，放大观察人物的动作与表情。</div></div></div>
            <div class="filter-row" id="filters">
              <button class="chip active" data-filter="all">全部 20</button>
              <button class="chip" data-filter="good">良好品质</button>
              <button class="chip" data-filter="neutral">性格特点</button>
              <button class="chip" data-filter="improve">需要改进</button>
            </div>
            <div class="word-grid" id="wordGrid"></div>
          </section>
        </div>
      </section>

      <section class="panel" id="game">
        <section class="game-start" id="gameStart">
          <div class="game-start-inner">
            <div>
              <h2>两队同时出发，吃下正确的形容词！</h2>
              <div class="rules">
                <div class="rule"><b>双组触屏</b><span>每队使用自己画面下方的大方向键，也可直接滑动画面。</span></div>
                <div class="rule"><b>正确 +10</b><span>吃错 −3；撞墙或蛇身 −2。</span></div>
                <div class="rule"><b>完成即报告</b><span>比较得分、答对数与正确率。</span></div>
              </div>
              <div class="hint">提示：建议先用“图文闪卡”带读一遍，再开始评估。</div>
            </div>
            <div class="settings">
              <label class="setting"><span>队伍一名称</span><input id="teamAName" value="青蛇队" maxlength="10" aria-label="队伍一名称"></label>
              <label class="setting"><span>队伍二名称</span><input id="teamBName" value="蓝蛇队" maxlength="10" aria-label="队伍二名称"></label>
              <label class="setting"><span>每队题数</span><select id="questionCount"><option value="8">8题</option><option value="10" selected>10题</option><option value="15">15题</option><option value="20">20题</option></select></label>
              <label class="setting"><span>竞赛时间</span><select id="duration"><option value="90">1分30秒</option><option value="120" selected>2分钟</option><option value="180">3分钟</option></select></label>
              <button class="primary" id="startGame">3秒倒数 · 同步开始</button>
            </div>
          </div>
        </section>

        <div class="game-wrap" id="gameWrap">
          <div class="scorebar">
            <div class="team-score a"><span id="scoreAName">青蛇队</span><span class="score-num" id="scoreA">0</span></div>
            <div class="timer" id="timer">02:00</div>
            <div class="team-score b"><span class="score-num" id="scoreB">0</span><span id="scoreBName">蓝蛇队</span></div>
          </div>
          <div class="boards">
            <article class="board-card">
              <div class="prompt"><div class="prompt-art" id="promptArtA"></div><div><div class="qnum" id="qnumA">第1题</div><div class="clue" id="clueA"></div></div></div>
              <canvas id="canvasA" width="480" height="360" aria-label="队伍一游戏区域"></canvas>
              <div class="touch-zone">
                <div class="control-label">青蛇队触屏区 · 按方向键或在画面滑动</div>
                <div class="dpad" data-team="a" aria-label="青蛇队触屏方向键"><button class="up" data-dir="up" aria-label="向上">▲</button><button class="left" data-dir="left" aria-label="向左">◀</button><button class="down" data-dir="down" aria-label="向下">▼</button><button class="right" data-dir="right" aria-label="向右">▶</button></div>
              </div>
            </article>
            <article class="board-card">
              <div class="prompt"><div class="prompt-art" id="promptArtB"></div><div><div class="qnum" id="qnumB">第1题</div><div class="clue" id="clueB"></div></div></div>
              <canvas id="canvasB" width="480" height="360" aria-label="队伍二游戏区域"></canvas>
              <div class="touch-zone">
                <div class="control-label">蓝蛇队触屏区 · 按方向键或在画面滑动</div>
                <div class="dpad" data-team="b" aria-label="蓝蛇队触屏方向键"><button class="up" data-dir="up" aria-label="向上">▲</button><button class="left" data-dir="left" aria-label="向左">◀</button><button class="down" data-dir="down" aria-label="向下">▼</button><button class="right" data-dir="right" aria-label="向右">▶</button></div>
              </div>
            </article>
          </div>
          <div class="game-actions"><button class="secondary" id="pauseBtn">暂停</button><button class="secondary" id="endBtn">提前结束</button></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="countdown" id="countdown" aria-live="assertive">3</div>
  <div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="winnerText">
    <div class="result">
      <div class="print-title">人物形容词 · 双蛇竞赛学习报告</div>
      <div class="winner" id="winnerText"></div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="modal-actions"><button class="secondary" id="printBtn">打印报告</button><button class="primary" id="againBtn">再赛一局</button></div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";
    var words=[
      {w:"勇敢",p:"yǒng gǎn",bm:"berani",type:"good",m:"面对困难或危险时不害怕。",e:"志明很勇敢，主动帮助受困的小猫。",clue:"他不怕困难，冷静地帮助受困的小猫。"},
      {w:"诚实",p:"chéng shí",bm:"jujur",type:"good",m:"说真话，不欺骗别人。",e:"美玲拾到钱包后，诚实地交给老师。",clue:"她拾到钱包后，马上交给老师，没有拿走里面的东西。"},
      {w:"善良",p:"shàn liáng",bm:"baik hati",type:"good",m:"心地好，愿意关心别人。",e:"善良的阿米娜和同学共用雨伞。",clue:"下雨时，她愿意和没带伞的同学一起走。"},
      {w:"勤劳",p:"qín láo",bm:"rajin",type:"good",m:"努力做事，不怕辛苦。",e:"勤劳的凯文每天认真完成值日工作。",clue:"他每天认真打扫课室，从来不怕辛苦。"},
      {w:"聪明",p:"cōng míng",bm:"bijak",type:"good",m:"理解和解决问题的能力强。",e:"聪明的俊杰很快就解开了积木难题。",clue:"他动脑筋，很快就想出解决难题的方法。"},
      {w:"有礼貌",p:"yǒu lǐ mào",bm:"bersopan",type:"good",m:"言语和行为尊重别人。",e:"莎拉见到长辈会问好，是个有礼貌的孩子。",clue:"她见到长辈会问好，说话时也尊重别人。"},
      {w:"负责任",p:"fù zé rèn",bm:"bertanggungjawab",type:"good",m:"认真做好自己应该做的事。",e:"负责照顾植物的哈金每天都记得浇水。",clue:"老师交代他照顾植物，他每天都认真完成任务。"},
      {w:"乐于助人",p:"lè yú zhù rén",bm:"suka menolong",type:"good",m:"很愿意主动帮助别人。",e:"乐于助人的丽莎帮同学搬书。",clue:"看见同学拿着很多书，她马上上前帮忙。"},
      {w:"有耐心",p:"yǒu nài xīn",bm:"sabar",type:"good",m:"能耐心等待或反复教导。",e:"哥哥有耐心地教弟弟绑鞋带。",clue:"朋友学得很慢，他仍然一次又一次地教。"},
      {w:"自信",p:"zì xìn",bm:"yakin diri",type:"good",m:"相信自己的能力。",e:"自信的欣怡大方地上台分享。",clue:"她相信自己，上台分享时声音响亮，态度大方。"},
      {w:"活泼",p:"huó pō",bm:"aktif dan ceria",type:"neutral",m:"生动自然，爱活动。",e:"活泼的佳佳喜欢跑跳和参加活动。",clue:"她总是充满活力，喜欢跑跑跳跳和参加活动。"},
      {w:"幽默",p:"yōu mò",bm:"lucu",type:"neutral",m:"说话有趣，常使人发笑。",e:"幽默的拉朱用手偶逗得大家哈哈大笑。",clue:"他说话有趣，还用手偶逗得大家哈哈大笑。"},
      {w:"害羞",p:"hài xiū",bm:"pemalu",type:"neutral",m:"在别人面前不自在，不敢大方表现。",e:"害羞的安安发言时轻轻地低下头。",clue:"轮到她发言时，她脸红了，还躲在书本后面。"},
      {w:"粗心",p:"cū xīn",bm:"cuai",type:"improve",m:"做事不细心，容易忽略东西。",e:"粗心的小华离开课室时忘了带铅笔盒。",clue:"他匆忙离开课室，竟然把铅笔盒忘在桌上。"},
      {w:"懒惰",p:"lǎn duò",bm:"malas",type:"improve",m:"不爱劳动和学习。",e:"他因为懒惰，常常不完成作业。",clue:"功课还没完成，他却趴在桌上，不愿继续做。"},
      {w:"骄傲",p:"jiāo ào",bm:"sombong",type:"improve",m:"自以为了不起，看不起别人。",e:"他拿到奖杯后变得骄傲，不理会队友。",clue:"她拿到奖杯后自以为了不起，还不愿感谢队友。"},
      {w:"自私",p:"zì sī",bm:"mementingkan diri",type:"improve",m:"只顾自己，不替别人着想。",e:"他自私地把所有彩色笔留给自己。",clue:"他把所有彩色笔抱在怀里，不肯和同学分享。"},
      {w:"固执",p:"gù zhí",bm:"degil",type:"improve",m:"坚持自己的意见，不听劝告。",e:"大家耐心劝他，他还是固执地不肯改变。",clue:"朋友提出好建议，他却抱着手臂，怎么也不肯听。"},
      {w:"马虎",p:"mǎ hu",bm:"sambil lewa",type:"improve",m:"做事草率，不认真检查。",e:"他马虎地交上作业，没有检查答案。",clue:"他随便完成练习就交上去，连明显的错误也没检查。"},
      {w:"冲动",p:"chōng dòng",bm:"terburu-buru",type:"improve",m:"没有想清楚就马上行动。",e:"他一时冲动，没看清楚就冲去抢球。",clue:"他还没看清周围，就急急忙忙冲出去抢球。"}
    ];
    var typeNames={good:"良好品质",neutral:"性格特点",improve:"需要改进"};
    function pos(i){return (i%5)*25+"% "+Math.floor(i/5)*33.3333+"%"}
    function setBg(el,i){el.style.backgroundPosition=pos(i)}
    var current=0,filter="all";
    var els={art:byId("mainArt"),word:byId("mainWord"),pinyin:byId("mainPinyin"),meaning:byId("mainMeaning"),bm:byId("mainBm"),example:byId("mainExample"),counter:byId("counter"),grid:byId("wordGrid")};
    function byId(id){return document.getElementById(id)}
    function showCard(i){
      current=(i+words.length)%words.length;var x=words[current];
      setBg(els.art,current);els.art.setAttribute("aria-label",x.w+"的情境图");
      els.word.textContent=x.w;els.pinyin.textContent=x.p;els.meaning.textContent=x.m;
      els.bm.textContent="马来文："+x.bm;els.example.textContent="例句："+x.e;els.counter.textContent=(current+1)+" / "+words.length;
      document.querySelectorAll(".mini-card").forEach(function(c){c.setAttribute("aria-current",Number(c.dataset.i)===current?"true":"false")});
    }
    function renderGrid(){
      els.grid.innerHTML="";
      words.forEach(function(x,i){
        if(filter!=="all"&&x.type!==filter)return;
        var b=document.createElement("button");b.className="mini-card";b.dataset.i=i;
        b.innerHTML='<div class="mini-art"></div><div class="mini-copy"><div class="mini-word">'+x.w+'</div><div class="mini-pinyin">'+x.p+'</div><span class="tag '+x.type+'">'+typeNames[x.type]+"</span></div>";
        setBg(b.querySelector(".mini-art"),i);
        b.onclick=function(){showCard(i);window.scrollTo({top:0,behavior:"smooth"})};
        els.grid.appendChild(b);
      });
    }
    byId("prevCard").onclick=function(){showCard(current-1)};byId("nextCard").onclick=function(){showCard(current+1)};
    byId("speakBtn").onclick=function(){
      if(!("speechSynthesis" in window)){toast("这台设备暂不支持语音朗读");return}
      speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(words[current].w+"。"+words[current].e);u.lang="zh-CN";u.rate=.78;speechSynthesis.speak(u);
    };
    byId("filters").onclick=function(e){
      var b=e.target.closest(".chip");if(!b)return;filter=b.dataset.filter;
      document.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("active",x===b)});renderGrid();
    };
    document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){
      document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("active",x===t)});
      document.querySelectorAll(".panel").forEach(function(x){x.classList.toggle("active",x.id===t.dataset.panel)});
    }});
    byId("fullscreenBtn").onclick=function(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else{document.exitFullscreen&&document.exitFullscreen()}};

    var CELL=20,COLS=24,ROWS=18,tickHandle=null,timeHandle=null,countdownHandle=null,endArmTimer=null,seconds=120,paused=false,running=false,counting=false,endArmed=false,totalQ=10,sequence=[];
    function team(id,canvas,color,startX,dir){
      return{id:id,canvas:canvas,ctx:canvas.getContext("2d"),color:color,startX:startX,dir:dir,next:dir,snake:[],score:0,right:0,wrong:0,hits:0,q:0,options:[],done:false,name:""};
    }
    var A=team("A",byId("canvasA"),"#5ce1a7",6,{x:1,y:0});
    var B=team("B",byId("canvasB"),"#82b1ff",17,{x:-1,y:0});
    function resetSnake(t){
      var d=t.id==="A"?{x:1,y:0}:{x:-1,y:0};t.dir=d;t.next=d;t.snake=[];
      for(var i=0;i<5;i++)t.snake.push({x:t.startX-d.x*i,y:9});
    }
    function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),q=a[i];a[i]=a[j];a[j]=q}return a}
    function getOptions(correctIndex){
      var ids=words.map(function(_,i){return i}).filter(function(i){return i!==correctIndex});
      shuffle(ids);return shuffle([correctIndex,ids[0],ids[1],ids[2]]).map(function(i,k){
        var anchors=[[4,4],[18,4],[5,14],[18,14]],colors=["#ffffff","#dff8ee","#e2ecff","#fff0bf"];
        return{idx:i,x:anchors[k][0]+Math.floor(Math.random()*2),y:anchors[k][1]+Math.floor(Math.random()*2),color:colors[k]};
      });
    }
    function loadQuestion(t){
      if(t.q>=totalQ){t.done=true;updatePrompt(t);return}
      var idx=sequence[t.q];t.options=getOptions(idx);updatePrompt(t);
    }
    function updatePrompt(t){
      var qnum=byId("qnum"+t.id),clue=byId("clue"+t.id),art=byId("promptArt"+t.id);
      if(t.done){qnum.textContent="已完成 "+totalQ+" 题";clue.textContent="太棒了！等待另一队完成。";art.style.backgroundImage="none";art.textContent="✓";art.style.display="grid";art.style.placeItems="center";art.style.fontSize="2rem";return}
      var idx=sequence[t.q];qnum.textContent="第 "+(t.q+1)+" / "+totalQ+" 题";clue.textContent=words[idx].clue;
      art.style.backgroundImage='url("adjectives-sprite.webp")';art.textContent="";art.style.display="block";setBg(art,idx);
    }
    function setDir(t,d){
      if(!running||paused||t.done)return;
      if(d.x!==-t.dir.x||d.y!==-t.dir.y)t.next=d;
    }
    window.addEventListener("keydown",function(e){
      var k=e.key.toLowerCase(),handled=true;
      if(k==="w")setDir(A,{x:0,y:-1});else if(k==="s")setDir(A,{x:0,y:1});else if(k==="a")setDir(A,{x:-1,y:0});else if(k==="d")setDir(A,{x:1,y:0});
      else if(e.key==="ArrowUp")setDir(B,{x:0,y:-1});else if(e.key==="ArrowDown")setDir(B,{x:0,y:1});else if(e.key==="ArrowLeft")setDir(B,{x:-1,y:0});else if(e.key==="ArrowRight")setDir(B,{x:1,y:0});else handled=false;
      if(handled)e.preventDefault();
    },{passive:false});
    document.querySelectorAll(".dpad").forEach(function(p){p.querySelectorAll("button").forEach(function(b){
      function go(e){e.preventDefault();b.classList.add("pressed");if(b.setPointerCapture)try{b.setPointerCapture(e.pointerId)}catch(_e){}var t=p.dataset.team==="a"?A:B,d=b.dataset.dir;setDir(t,d==="up"?{x:0,y:-1}:d==="down"?{x:0,y:1}:d==="left"?{x:-1,y:0}:{x:1,y:0});if(navigator.vibrate)navigator.vibrate(18)}
      function release(){b.classList.remove("pressed")}
      b.addEventListener("pointerdown",go);
      b.addEventListener("pointerup",release);b.addEventListener("pointercancel",release);b.addEventListener("lostpointercapture",release);
    })});
    function bindSwipe(canvas,t){
      var touches=new Map();
      canvas.addEventListener("pointerdown",function(e){e.preventDefault();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(canvas.setPointerCapture)try{canvas.setPointerCapture(e.pointerId)}catch(_e){}},{passive:false});
      canvas.addEventListener("pointerup",function(e){e.preventDefault();var s=touches.get(e.pointerId);touches.delete(e.pointerId);if(!s)return;var dx=e.clientX-s.x,dy=e.clientY-s.y;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;setDir(t,Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1})},{passive:false});
      canvas.addEventListener("pointercancel",function(e){touches.delete(e.pointerId)});
    }
    bindSwipe(A.canvas,A);bindSwipe(B.canvas,B);
    function move(t){
      if(t.done)return;t.dir=t.next;var h=t.snake[0],n={x:h.x+t.dir.x,y:h.y+t.dir.y};
      var crash=n.x<0||n.x>=COLS||n.y<0||n.y>=ROWS||t.snake.some(function(s){return s.x===n.x&&s.y===n.y});
      if(crash){t.score=Math.max(0,t.score-2);t.hits++;resetSnake(t);toast(t.name+" 碰撞 −2");return}
      t.snake.unshift(n);var eaten=-1;
      t.options.forEach(function(o,i){if(Math.abs(n.x-o.x)<=2&&Math.abs(n.y-o.y)<=1)eaten=i});
      if(eaten>=0){
        var opt=t.options[eaten],correct=sequence[t.q];
        if(opt.idx===correct){t.score+=10;t.right++;toast(t.name+" 答对了！+10")}else{t.score=Math.max(0,t.score-3);t.wrong++;toast(t.name+" 吃错了 −3")}
        t.q++;loadQuestion(t);
      }else t.snake.pop();
    }
    function draw(t){
      var c=t.ctx;c.clearRect(0,0,480,360);
      c.fillStyle="#102039";c.fillRect(0,0,480,360);
      c.strokeStyle="rgba(255,255,255,.045)";c.lineWidth=1;
      for(var x=0;x<=480;x+=CELL){c.beginPath();c.moveTo(x,0);c.lineTo(x,360);c.stroke()}
      for(var y=0;y<=360;y+=CELL){c.beginPath();c.moveTo(0,y);c.lineTo(480,y);c.stroke()}
      if(!t.done)t.options.forEach(function(o){
        var label=words[o.idx].w,w=Math.max(72,label.length*25+22),px=o.x*CELL+10,py=o.y*CELL+10;
        c.fillStyle=o.color;roundRect(c,px-w/2,py-16,w,32,13);c.fill();
        c.fillStyle="#12233f";c.font="900 18px Microsoft YaHei, sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText(label,px,py+1);
      });
      t.snake.forEach(function(s,i){var px=s.x*CELL+2,py=s.y*CELL+2;c.fillStyle=i===0?"#fff":t.color;roundRect(c,px,py,16,16,5);c.fill();
        if(i===0){c.fillStyle="#12233f";c.beginPath();c.arc(px+6,py+7,1.5,0,7);c.arc(px+11,py+7,1.5,0,7);c.fill()}
      });
      if(t.done){c.fillStyle="#ffffffdd";c.font="950 30px Microsoft YaHei";c.textAlign="center";c.fillText("完成！",240,180)}
    }
    function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
    function updateScores(){byId("scoreA").textContent=A.score;byId("scoreB").textContent=B.score}
    function tick(){if(paused)return;move(A);move(B);draw(A);draw(B);updateScores();if(A.done&&B.done)finishGame()}
    function clock(){if(paused)return;seconds--;renderTime();if(seconds<=0)finishGame()}
    function renderTime(){var m=Math.floor(seconds/60),s=seconds%60;byId("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
    function beginCountdown(){
      var n=3,screen=byId("countdown");counting=true;running=false;screen.textContent=n;screen.classList.add("show");clearInterval(countdownHandle);
      countdownHandle=setInterval(function(){n--;if(n>0){screen.textContent=n;return}clearInterval(countdownHandle);screen.textContent="开始！";counting=false;running=true;tickHandle=setInterval(tick,135);timeHandle=setInterval(clock,1000);setTimeout(function(){screen.classList.remove("show")},550)},1000);
    }
    byId("startGame").onclick=function(){
      A.name=byId("teamAName").value.trim()||"青蛇队";B.name=byId("teamBName").value.trim()||"蓝蛇队";
      totalQ=Number(byId("questionCount").value);seconds=Number(byId("duration").value);
      sequence=shuffle(words.map(function(_,i){return i})).slice(0,totalQ);
      [A,B].forEach(function(t){t.score=0;t.right=0;t.wrong=0;t.hits=0;t.q=0;t.done=false;resetSnake(t);loadQuestion(t)});
      byId("scoreAName").textContent=A.name;byId("scoreBName").textContent=B.name;updateScores();renderTime();
      byId("gameStart").style.display="none";byId("gameWrap").classList.add("show");paused=false;running=false;byId("pauseBtn").textContent="暂停";
      resetEndButton();
      clearInterval(tickHandle);clearInterval(timeHandle);clearInterval(countdownHandle);draw(A);draw(B);beginCountdown();
    };
    byId("pauseBtn").onclick=function(){if(!running)return;paused=!paused;this.textContent=paused?"继续":"暂停";toast(paused?"比赛已暂停":"比赛继续")};
    function resetEndButton(){endArmed=false;clearTimeout(endArmTimer);var b=byId("endBtn");b.textContent="提前结束";b.classList.remove("armed")}
    byId("endBtn").addEventListener("pointerdown",function(e){
      e.preventDefault();
      if(!running&&!counting){toast("比赛尚未开始");return}
      if(endArmed){resetEndButton();finishGame();return}
      endArmed=true;this.textContent="再按一次确认结束";this.classList.add("armed");toast("3秒内再按一次，结束比赛");
      endArmTimer=setTimeout(resetEndButton,3000);
    },{passive:false});
    function finishGame(){
      if(!running&&!counting)return;running=false;counting=false;resetEndButton();clearInterval(countdownHandle);clearInterval(tickHandle);clearInterval(timeHandle);byId("countdown").classList.remove("show");
      var win=A.score===B.score?"平局！":(A.score>B.score?A.name:B.name)+" 获胜！";
      byId("winnerText").textContent="🏆 "+win;
      byId("resultGrid").innerHTML=resultCard(A,"#17b978")+resultCard(B,"#2e6cf6");
      byId("resultModal").classList.add("show");
    }
    function resultCard(t,color){
      var answered=t.right+t.wrong,acc=answered?Math.round(t.right/answered*100):0;
      return '<section class="result-team" style="border-top:7px solid '+color+'"><h3>'+safe(t.name)+'</h3><div class="stat"><span>总分</span><b>'+t.score+' 分</b></div><div class="stat"><span>完成题数</span><b>'+answered+' / '+totalQ+'</b></div><div class="stat"><span>答对</span><b>'+t.right+' 题</b></div><div class="stat"><span>答错</span><b>'+t.wrong+' 题</b></div><div class="stat"><span>正确率</span><b>'+acc+'%</b></div><div class="stat"><span>碰撞</span><b>'+t.hits+' 次</b></div></section>';
    }
    function safe(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
    byId("printBtn").onclick=function(){window.print()};
    byId("againBtn").onclick=function(){resetEndButton();byId("resultModal").classList.remove("show");byId("gameWrap").classList.remove("show");byId("gameStart").style.display="block"};
    var toastTimer;function toast(s){var e=byId("toast");e.textContent=s;e.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove("show")},900)}
    renderGrid();showCard(0);resetSnake(A);resetSnake(B);draw(A);draw(B);
  })();
  </script>
</body>
